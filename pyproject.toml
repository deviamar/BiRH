[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "morpholab"
version = "0.1.0"
description = "Morphology Lab — a computational research platform for robotic hand morphology optimization"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Devi Amarsaikhan" }]
keywords = ["robotics", "grasping", "mujoco", "morphology", "optimization", "evolution"]

dependencies = [
    "mujoco>=3.1",
    "numpy>=1.24",
    "scipy>=1.10",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
analysis = ["pandas>=2.0", "scikit-learn>=1.3"]
viz = ["matplotlib>=3.7", "imageio>=2.30", "imageio-ffmpeg>=0.4"]
optimize = ["cma>=3.3"]
dev = ["pytest>=7.4", "pytest-timeout>=2.1"]
all = [
    "pandas>=2.0", "scikit-learn>=1.3",
    "matplotlib>=3.7", "imageio>=2.30", "imageio-ffmpeg>=0.4",
    "cma>=3.3", "pytest>=7.4",
]

[project.scripts]
morpholab = "morpholab.cli:main"

[tool.setuptools.packages.find]
include = ["morpholab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: tests that take more than a few seconds",
    "render: tests that require a working GL backend",
]

[tool.ruff]
line-length = 100
target-version = "py310"
